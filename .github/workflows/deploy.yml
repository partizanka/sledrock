name: Deploy Next.js to hb.by

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # или '18', смотря какая у тебя

      # Устанавливаем зависимости
      - name: Install dependencies
        run: npm install

      # Собираем статический сайт
      - name: Build project
        run: npm run build

      # Заливаем только папку 'out' на хостинг
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/ # Отправляем только готовую сборку
          server-dir: /sledrock.by/
          # Очищаем папку перед загрузкой, чтобы не было старых файлов
          dangerous-clean-slate: true 
